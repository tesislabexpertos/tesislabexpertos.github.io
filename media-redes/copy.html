<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="robots" content="noindex"><title>Copiar imagen</title></head>
<body style="font-family:sans-serif">
<button id="b" style="font-size:22px;padding:12px 24px">COPIAR</button> <span id="s"></span>
<br><img id="i" style="max-height:300px;margin-top:10px">
<script>
const id = new URLSearchParams(location.search).get('id');
document.getElementById('i').src = './' + id;
document.getElementById('b').onclick = async () => {
  const s = document.getElementById('s');
  try {
    const r = await fetch('./' + id);
    const bmp = await createImageBitmap(await r.blob());
    const c = document.createElement('canvas'); c.width = bmp.width; c.height = bmp.height;
    c.getContext('2d').drawImage(bmp, 0, 0);
    const png = await new Promise(res => c.toBlob(res, 'image/png'));
    await navigator.clipboard.write([new ClipboardItem({ 'image/png': png })]);
    s.textContent = 'copiado ' + id;
  } catch (e) { s.textContent = 'error ' + e.message; }
};
</script></body></html>
